name: Testar compilação original

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar projeto e submódulos originais
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Ativar pnpm
        run: corepack enable

      - name: Instalar dependências sem alterar versões
        run: pnpm install --frozen-lockfile

      - name: Compilar versão web original
        run: pnpm build

      - name: Guardar arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: pokerogue-web-original
          path: dist/
          if-no-files-found: error
          retention-days: 7
