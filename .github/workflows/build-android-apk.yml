name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - "index.css"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar projeto e submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências do jogo
        run: pnpm install --frozen-lockfile

      - name: Compilar versão destinada ao app
        run: pnpm build:app

      - name: Preparar arquivos web para Android
        run: |
          mkdir -p android-wrapper/www
          cp -a dist/. android-wrapper/www/

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências Capacitor
        working-directory: android-wrapper
        run: npm install

      - name: Criar projeto Android nativo
        working-directory: android-wrapper
        run: npx cap add android

      - name: Configurar tela horizontal e modo imersivo
        working-directory: android-wrapper
        run: python3 prepare-android.py

      - name: Configurar orientação horizontal e tela cheia
        working-directory: android-wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          activity = root.find(".//activity")
          if activity is None:
              raise SystemExit("Activity principal não encontrada no manifesto Android")
          activity.set(android_ns + "screenOrientation", "landscape")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          java_dir = Path("android/app/src/main/java/com/pedra12/pokerogue")
          java_dir.mkdir(parents=True, exist_ok=True)
          main_activity = java_dir / "MainActivity.java"
          main_activity.write_text("""package com.pedra12.pokerogue;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private void enableImmersiveMode() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enableImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enableImmersiveMode();
              }
          }
          """)
          PY

      - name: Sincronizar jogo com Android
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Compilar APK de depuração
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK para instalação
        uses: actions/upload-artifact@v4
        with:
          name: pokerogue-android-debug-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
